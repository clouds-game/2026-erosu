<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI replay comparison</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: #101319; color: #e6edf3; font: 15px system-ui; }
  main { max-width: 1000px; margin: auto; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #aab5c5; margin: 8px 0; }
  .boards { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .board { display: grid; justify-items: center; gap: 8px; min-width: 0; }
  canvas { display: block; height: min(50vh,450px); max-width: 100%; aspect-ratio: 10/18; background: #1b2636; }
  .stats { text-align: center; font-variant-numeric: tabular-nums; }
  button, select { font: inherit; color: inherit; background: #263448; border: 1px solid #66758c; border-radius: 5px; padding: 7px 10px; }
  .board select { width: 100%; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
  input { flex: 1; min-width: 120px; }
  output { min-width: 105px; font-variant-numeric: tabular-nums; }
  details { margin: 12px 0; color: #aab5c5; }
  summary { cursor: pointer; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
  th, td { padding: 5px 8px; text-align: right; border-bottom: 1px solid #263448; }
  th:first-child, td:first-child { text-align: left; }
  @media (max-width: 620px) { body { padding: 10px; } .boards { gap: 10px; } canvas { height: min(43vh,300px); } .stats { font-size: 12px; } select { font-size: 12px; } }
</style>
<main>
  <h1 id="title">AI replay comparison</h1>
  <div class="controls"><label for="seed">Seed</label><select id="seed"></select><span id="meta"></span></div>
  <div class="boards">
    <section class="board"><select id="before-policy" aria-label="Left policy"></select><canvas id="before" width="300" height="540" aria-label="Left replay board"></canvas><div class="stats" id="before-stats"></div><p class="stats" id="before-result"></p></section>
    <section class="board"><select id="after-policy" aria-label="Right policy"></select><canvas id="after" width="300" height="540" aria-label="Right replay board"></canvas><div class="stats" id="after-stats"></div><p class="stats" id="after-result"></p></section>
  </div>
  <div class="controls">
    <button id="back" aria-label="Previous piece">←</button><button id="play">Play</button><button id="forward" aria-label="Next piece">→</button><button id="end">End</button>
    <input id="position" aria-label="Piece position" type="range" min="0" value="0" step="1"><output id="turn"></output>
    <select id="speed" aria-label="Playback speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
  </div>
  <p>Aligned by placed-piece number; playback is normalized within each turn.</p>
  <details id="benchmark" hidden><summary id="benchmark-summary"></summary><table><thead><tr><th>Policy</th><th>Mean pieces</th><th>Mean score</th><th>Gold clear games</th></tr></thead><tbody id="benchmark-rows"></tbody></table></details>
</main>
<script id="replay-data" type="application/json">__REPLAY_DATA__</script>
<script>__REPLAY_SCRIPT__</script>
</html>
